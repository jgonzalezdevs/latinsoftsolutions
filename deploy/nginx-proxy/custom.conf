# Configuracion personalizada para nginx-proxy
# Este archivo se monta en /etc/nginx/conf.d/custom.conf

# Aumentar el tamano maximo de archivos subidos
client_max_body_size 50m;

# Timeouts
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Buffer sizes
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/xhtml+xml
    font/woff
    font/woff2
    image/svg+xml;
gzip_comp_level 6;

# Security headers (aplicados globalmente)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Real IP configuration (para obtener IP real del cliente)
real_ip_header X-Forwarded-For;
real_ip_recursive on;
